<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Goals Desk</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">API-Football live monitor</p>
        <h1>Live Goals Desk</h1>
        <p class="subtitle">Halftime over 0.5 and full-match goal pressure, with the evidence shown.</p>
      </div>
      <button id="refresh">Refresh now</button>
    </header>

    <main>
      <section class="statusbar">
        <span id="connection">Starting...</span>
        <span id="updated"></span>
        <span id="quota"></span>
        <span id="alerts"></span>
      </section>
      <section id="notice" class="notice">
        Signals are decision support, not predictions or guarantees. Check lineups, red cards,
        match context, and the actual market before risking money.
      </section>
      <section id="fixtures" class="fixtures"></section>
    </main>

    <template id="fixture-template">
      <article class="fixture-card">
        <div class="fixture-head">
          <div>
            <p class="competition"></p>
            <h2 class="teams"></h2>
          </div>
          <div class="clock">
            <strong class="score"></strong>
            <span class="minute"></span>
          </div>
        </div>
        <div class="stats"></div>
        <div class="signals"></div>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
