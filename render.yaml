services:
  - type: cron
    name: football-daily-digest
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 23,3,7,11,15,19 * * *"
    buildCommand: npm test
    startCommand: npm run digest
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: API_FOOTBALL_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: DIGEST_EMAIL_FROM
        value: Football Digest <onboarding@resend.dev>
      - key: DIGEST_TIMEZONE
        value: Asia/Singapore
      - key: DIGEST_WINDOW_HOURS
        value: 6
      - key: DIGEST_MAX_ANALYSES
        value: 25
      - key: DIGEST_MAX_PICKS
        value: 12
      - key: DIGEST_CONCURRENCY
        value: 4

  - type: cron
    name: football-live-alerts
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: npm test
    startCommand: npm run live-alerts
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: API_FOOTBALL_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        value: Live Goals Desk <onboarding@resend.dev>
      - key: ALERT_MIN_LEVEL
        value: watch
      - key: ALERT_COOLDOWN_MINUTES
        value: 90
      - key: STATISTICS_REFRESH_SECONDS
        value: 120
      - key: UNAVAILABLE_RETRY_SECONDS
        value: 900
      - key: ODDS_REFRESH_SECONDS
        value: 300
