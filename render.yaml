services:
  - type: cron
    name: football-daily-digest
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 23,3,7,11,15,19 * * *"
    buildCommand: npm test
    startCommand: npm run digest
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FOOTBALL_PROVIDER
        value: sportmonks
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_MODEL_SIGNALS_ENABLED
        value: true
      - key: API_FOOTBALL_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: DIGEST_EMAIL_FROM
        value: Football Digest <onboarding@resend.dev>
      - key: DIGEST_TIMEZONE
        value: Asia/Singapore
      - key: DIGEST_WINDOW_HOURS
        value: 6
      - key: DIGEST_MAX_ANALYSES
        value: 25
      - key: DIGEST_MAX_PICKS
        value: 12
      - key: DIGEST_CONCURRENCY
        value: 4
